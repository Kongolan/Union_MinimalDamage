name: Build Gothic Union Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x86

      # 1. ZWINGEND ERFORDERLICH: Installiert die 32-bit Runtimes für GothicVDFS
      - name: Install vcredist (x86)
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x86.exe" -OutFile "vc_redist.x86.exe"
          Start-Process -FilePath "vc_redist.x86.exe" -ArgumentList "/install /quiet /norestart" -Wait

      - name: Configure CMake (G2A-Release)
        run: cmake . --preset G2A-Release

      # 2. SICHERHEITSNETZ: Beide Ordner erzwingen, damit GothicVDFS nicht abstürzt
      - name: Prepare VDF Environment
        run: |
          mkdir -p out/build/G2A-Release/vdf/System/Autorun
          mkdir -p out/build/G2A-Release/vdf/_Work
        shell: bash

      - name: Build Plugin
        run: cmake --build --preset G2A-Release

      - name: Find generated VDF file
        id: find_vdf
        run: |
          # Sucht rekursiv nach der generierten .vdf Datei
          $vdf_path = Get-ChildItem -Recurse -Filter "*.vdf" | Select-Object -First 1 -ExpandProperty FullName
          if ($vdf_path) {
            echo "Gefundene VDF: $vdf_path"
            echo "VDF_FILE=$vdf_path" >> $env:GITHUB_ENV
          } else {
            Write-Error "Es konnte keine .vdf Datei gefunden werden! Bitte CMakeLists.txt und build.vm prüfen."
          }
        shell: powershell

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Union_MinimalDamage_VDF
          path: ${{ env.VDF_FILE }}